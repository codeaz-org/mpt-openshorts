name: OpenShorts Dry Run
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: specific YouTube URL to test instead of running research"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install this repo's deps
        run: pip install -r requirements.txt

      - name: Clone OpenShorts
        run: git clone --depth 1 https://github.com/mutonby/openshorts.git openshorts_app

      - name: Start OpenShorts (backend + renderer)
        working-directory: openshorts_app
        run: docker compose up -d backend renderer

      - name: Wait for OpenShorts to be healthy
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 3
          done
          curl -sf http://localhost:8000/health || (echo "OpenShorts never became healthy" && exit 1)

      - name: Run dry_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENSHORTS_BASE_URL: http://localhost:8000
        run: |
          if [ -n "${{ github.event.inputs.url }}" ]; then
            python dry_run.py --url "${{ github.event.inputs.url }}"
          else
            python dry_run.py
          fi

      - name: Upload clips + report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: dry_run_output/
          retention-days: 14
