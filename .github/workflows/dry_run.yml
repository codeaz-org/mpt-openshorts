name: OpenShorts Dry Run
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: specific YouTube URL to test instead of running research"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install this repo's deps
        run: pip install -r requirements.txt

      - name: Route the runner through Surfshark (WireGuard)
        env:
          SURFSHARK_PRIVATE_KEY: ${{ secrets.SURFSHARK_PRIVATE_KEY }}
          SURFSHARK_PUBLIC_KEY: ${{ secrets.SURFSHARK_PUBLIC_KEY }}
        run: |
          # YouTube refuses GitHub's IP ranges outright ("Sign in to confirm
          # you're not a bot") -- they are saturated with scrapers. A PO token
          # provider did not help, because this is IP reputation, not the token
          # challenge. Surfshark's exit is also a datacenter IP but is not on
          # that list: verified by hand, yt-dlp fetched the same video through
          # it with no challenge. Containers inherit the host's routing, so the
          # tunnel has to come up before docker compose starts.
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          before=$(curl -s -m 20 https://ipinfo.io/org || echo unknown)
          sudo mkdir -p /etc/wireguard
          # No DNS= line: wg-quick shells out to resolvconf for it, which the
          # runner image does not ship, and the run dies bringing the link up.
          printf '%s\n' \
            '[Interface]' \
            'Address = 10.14.0.2/16' \
            "PrivateKey = ${SURFSHARK_PRIVATE_KEY}" \
            '[Peer]' \
            "PublicKey = ${SURFSHARK_PUBLIC_KEY}" \
            'AllowedIPs = 0.0.0.0/0' \
            'Endpoint = ro-buc.prod.surfshark.com:51820' \
            'PersistentKeepalive = 25' \
            | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          after=$(curl -s -m 20 https://ipinfo.io/org || echo unknown)
          echo "exit org before tunnel: $before"
          echo "exit org after tunnel : $after"
          if [ "$before" = "$after" ]; then
            echo "::error::WireGuard came up but the exit IP did not change"
            exit 1
          fi

      - name: Clone OpenShorts
        run: git clone --depth 1 https://github.com/mutonby/openshorts.git openshorts_app

      - name: Make OpenShorts' mounted dirs writable
        working-directory: openshorts_app
        run: |
          # docker-compose mounts the checkout over /app, which hides the
          # directories the image created for its non-root appuser. The
          # runner's checkout is owned by a different uid, so the backend
          # crash-looped on "PermissionError: [Errno 13] Permission denied:
          # 'uploads'" at import time and never served /health. Creating them
          # on the host first is enough; the container writes as appuser.
          # Not just these dirs: the app also writes into the mount ROOT at
          # runtime (ultralytics drops yolov8n.pt in the cwd, matplotlib wants
          # .config), so the whole checkout has to be writable by appuser.
          mkdir -p uploads output .cache/huggingface .config
          chmod -R a+rwX .

      - name: Configure a PO token provider for yt-dlp
        working-directory: openshorts_app
        run: |
          # YouTube answers datacenter IPs (every GitHub runner) with "Sign in
          # to confirm you're not a bot", which killed the download step. The
          # backend image already ships the bgutil PO-token plugin and reads
          # BGUTIL_BASE_URL, so run the provider alongside it and point the
          # backend at it. No cookies, no account credentials in CI.
          # printf, not a heredoc: inside a YAML block scalar every line
          # carries the block's indentation, which would end up in the file.
          printf '%s\n' \
            'services:' \
            '  bgutil-pot:' \
            '    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2' \
            '    container_name: bgutil-pot' \
            '    restart: unless-stopped' \
            '  backend:' \
            '    environment:' \
            '      - BGUTIL_BASE_URL=http://bgutil-pot:4416' \
            '      - YOUTUBE_COOKIES' \
            > docker-compose.override.yml
          cat docker-compose.override.yml
          docker compose config >/dev/null && echo "compose config valid"

      - name: Start OpenShorts (backend + renderer + PO token provider)
        working-directory: openshorts_app
        # YOUTUBE_COOKIES is listed by name in the override, so compose passes
        # through whatever this step has. Unset, the backend logs that it has
        # no cookies and tries without them -- same behaviour as before.
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: docker compose up -d backend renderer bgutil-pot

      - name: Wait for OpenShorts to be healthy
        working-directory: openshorts_app
        run: |
          # The backend imports torch/whisper and fetches detection weights on
          # first boot: 180s was enough locally and not on a runner, where the
          # dry run died here with the containers still starting. 10 minutes,
          # and the container's own state is checked so a crash-loop reports as
          # a crash instead of as a timeout.
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "healthy after $((i*5))s"; exit 0
            fi
            if [ -z "$(docker ps -q -f name=openshorts-backend)" ]; then
              echo "backend container is not running:"
              docker compose ps
              docker compose logs --tail=100 backend
              exit 1
            fi
            sleep 5
          done
          echo "OpenShorts never became healthy in 600s"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run dry_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENSHORTS_BASE_URL: http://localhost:8000
        run: |
          if [ -n "${{ github.event.inputs.url }}" ]; then
            python dry_run.py --url "${{ github.event.inputs.url }}"
          else
            python dry_run.py
          fi

      - name: Dump OpenShorts logs on failure
        if: failure()
        working-directory: openshorts_app
        run: docker compose logs --tail=200

      - name: Upload clips + report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: dry_run_output/
          retention-days: 14
